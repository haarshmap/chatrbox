services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    user: "root"
    ports:
      - '8080:8080'
    env_file:
      - .env
    volumes:
      - .:/app
      - sqlite_data:/var/data:z
    depends_on:
      redis:
        condition: service_started
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    env_file:
      - .env
    restart: unless-stopped
volumes:
  sqlite_data:
    driver: local
  redis-data:
    driver: local
