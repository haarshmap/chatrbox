services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    env_file:
      - .env
    volumes:
      - .:/app
      - sqlite_data:/data
    depends_on:
      redis:
        condition: service_started
  redis:
    image: redis:latest
    container_name: redis
    volumes:
      - redis-data:/data
    env_file:
      - .env
    restart: unless-stopped

volumes:
  sqlite_data:
    driver: local
  redis-data:
   driver: local
